name: Screenshots

# Builds the app on a Mac, lets it photograph itself (Tischrunde --screenshots)
# and commits the images to docs/screenshots on the same branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'Sources/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: App bauen
        run: scripts/build_app.sh
      - name: Screenshots aufnehmen
        run: |
          mkdir -p docs/screenshots
          build/Tischrunde.app/Contents/MacOS/Tischrunde --screenshots "$PWD/docs/screenshots" &
          PID=$!
          for i in $(seq 1 180); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          ls -la docs/screenshots
      - name: Hochladen
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
      - name: Einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Screenshots aktualisiert"
          git push
