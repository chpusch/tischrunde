name: Release

# Creates a public GitHub release with the app as ZIP. Start it either
# - on GitHub: Actions → Release → "Run workflow", enter a version (e.g. 0.1.0), or
# - by pushing a version tag (e.g. v0.1.0), or by creating a release in the GitHub UI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 0.1.0'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests
        run: swift test
      - name: App bauen
        run: scripts/build_app.sh
      - name: Verpacken
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          ditto -c -k --keepParent build/Tischrunde.app "dist/Tischrunde-$VERSION.zip"
          ditto -c -k build/tischrunde-cli "dist/tischrunde-cli-$VERSION.zip"
          ls -la dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Installation:** `Tischrunde-….zip` laden, entpacken, `Tischrunde.app` in *Programme* ziehen.
          Beim ersten Start **Rechtsklick → Öffnen** (die App ist nicht von Apple notarisiert).
          Voraussetzung: macOS 26 oder neuer. Für MP3: `brew install ffmpeg`.

          Details und Bedienung: siehe README.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. created in the GitHub UI): just attach the files.
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "Tischrunde ${TAG#v}" \
              --notes-file notes.md \
              --prerelease
          fi
